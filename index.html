<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG CITY - Free Automated PNG Objects & Things</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        header { background: #222; color: #fff; padding: 20px; border-radius: 8px; }
        h1 { margin: 0; color: #4CAF50; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 250px; }
        .card img { max-width: 100%; height: auto; background: #eee; border-radius: 4px; }
        .card p { font-weight: bold; color: #333; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>PNG CITY 🏙️</h1>
        <p>100% Automated Real & Processed PNG Objects Library</p>
    </header>

    <div class="gallery" id="gallery">
        <div class="card">
            <img src="processed_pngs/processed_image.png" alt="Processed PNG Object">
            <p>Auto-Generated PNG Item</p>
        </div>
    </div>

</body>
</html>
